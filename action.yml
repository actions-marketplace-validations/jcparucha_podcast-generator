name: "Podcast Generator by LinkedIn Learning Course (09/2026)"
author: "JC Parucha"
description: "Generates a feed for a podcast from YAML file"
runs:
  using: "docker"
  image: "Dockerfile"
branding: 
  icon: "git-branch"
  color: "red"
inputs:
  email: 
    description: The commiter's email address
    required: true
    default: ${{ github.actor }}@localhost
  name: 
    description: The commiter's name
    required: true
    default: ${{ github.actor }}
